<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Ivan Monster Hunt</title>
    <link rel="stylesheet" href="styles.css?v=devmode-map-editor" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="1280" height="720" aria-label="Ivan Monster Hunt game canvas"></canvas>

      <section class="launcher" id="launcher" aria-label="Profile launcher">
        <div class="launcher-panel">
          <header>
            <div>
              <strong>Ivan Monster Hunt</strong>
              <span>Choose a profile</span>
            </div>
          </header>

          <div class="profile-list" id="profile-list"></div>

          <form class="profile-form" id="profile-form">
            <input id="profile-name" type="text" maxlength="18" autocomplete="off" placeholder="New profile name" />
            <button id="profile-create" type="submit">Create</button>
          </form>

          <div class="profile-actions">
            <button id="profile-play" type="button">Play</button>
            <button id="profile-delete" type="button">Delete</button>
          </div>

          <p id="profile-status">Create or select a profile to begin.</p>
        </div>
      </section>

      <section class="hud" aria-label="Game status">
        <div class="brand">
          <strong>Ivan Monster Hunt</strong>
          <span id="world-label">World: Main World</span>
          <span id="time-label">Day 1 - 6:00 AM</span>
          <span id="caught-counter">Mattdogs caught: 0 / 20</span>
        </div>

        <div class="monster-slots" aria-label="Monster collection slots">
          <span class="slot"></span>
          <span class="slot"></span>
          <span class="slot"></span>
          <span class="slot"></span>
          <span class="slot"></span>
          <span class="slot"></span>
        </div>

        <div class="controls">
          <span>WASD / Arrows</span>
          <span>Shift</span>
          <span>Space</span>
          <button id="profile-menu" type="button">Profiles</button>
        </div>
      </section>

      <section class="dev-panel" id="dev-panel" aria-label="Developer tools" hidden>
        <header>
          <strong>Dev Mode</strong>
          <button id="dev-close" type="button">Close</button>
        </header>

        <label>
          World
          <select id="dev-world"></select>
        </label>

        <div class="dev-tools" id="dev-tools">
          <button type="button" data-tool="wall">Wall</button>
          <button type="button" data-tool="spawn">Spawn</button>
          <button type="button" data-tool="path">Path</button>
          <button type="button" data-tool="npc">NPC</button>
          <button type="button" data-tool="npcpath">NPC Path</button>
          <button type="button" data-tool="node">Node</button>
          <button type="button" data-tool="erase">Erase</button>
        </div>

        <label>
          NPC
          <select id="dev-npc"></select>
        </label>

        <label>
          Node Target
          <select id="dev-node-target"></select>
        </label>

        <div class="dev-actions">
          <button id="dev-save" type="button">Save All</button>
          <button id="dev-new-line" type="button">New Line</button>
          <button id="dev-respawn" type="button">Respawn</button>
          <button id="dev-export" type="button">Export All</button>
          <button id="dev-import" type="button">Import</button>
          <button id="dev-load-built-in" type="button">Load Built-In</button>
          <button id="dev-clear" type="button">Clear World</button>
        </div>

        <textarea id="dev-data" spellcheck="false" placeholder="Exported world data appears here. Paste data here, then Import."></textarea>

        <p id="dev-status">F1 toggles Dev Mode. E enters a nearby node.</p>
      </section>

      <section class="touch-controls" aria-label="Touch controls">
        <div class="touch-stick" id="touch-joystick" aria-label="Move Ivan">
          <span id="touch-knob"></span>
        </div>

        <div class="touch-actions">
          <button class="touch-button sprint" id="touch-sprint" type="button">RUN</button>
          <button class="touch-button whip" id="touch-whip" type="button">WHIP</button>
        </div>
      </section>

      <div class="loading" id="loading">Loading map...</div>
    </main>

    <script src="assets/worlds/default-worlds.js?v=npc-path-behavior"></script>
    <script src="game.js?v=arena-entry-scott-scale"></script>
  </body>
</html>
